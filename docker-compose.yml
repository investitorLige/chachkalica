# ─────────────────────────── Unified Chachkalica stack ───────────────────────────
# Brings up the whole system with a single command:
#
#   docker compose up -d
#
# Services:
#   postgres  – fleet state          redis    – RQ job queue
#   web       – Django admin+webhook  worker   – RQ background jobs (provisions
#                                                 Label Studio containers)
#   trainer   – friendy_chachkalica FastAPI torch training service
#
# web/worker build from ./chachkalica, trainer from ./friendy_chachkalica. Each
# subproject still keeps its own Dockerfile + docker-compose.yml for standalone use.
#
# THE SHARED FILESYSTEM: Django writes training-config YAMLs with ABSOLUTE paths
# under its BASE_DIR (/app/data/...). The trainer receives those strings over HTTP
# and opens them as-is, so it must expose the very same files at the very same path.
# All three app containers therefore bind-mount ./chachkalica/data at /app/data.
# All run as the container-default user (root) so files written by one are readable
# by the others — matching the standalone chachkalica stack.

x-app: &app
  build: ./chachkalica
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_DB: fleet
    POSTGRES_USER: fleet
    POSTGRES_PASSWORD: fleet
    REDIS_URL: redis://redis:6379/0
    DJANGO_DEBUG: "true"
    # Internal RD box reached from other machines on the LAN. Wildcard is fine
    # here (DEBUG dev box); tighten for anything internet-facing. CSRF needs
    # explicit scheme+host origins (no bare '*') for the admin login POST.
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://10.10.155.12:9000,http://10.10.80.67:9000,http://localhost:9000}
    # Containers reach the host-published webhook + Label Studio via the gateway.
    FLEET_LS_HOST: host.docker.internal
    # The worker provisions sibling Label Studio containers via the host docker
    # daemon, so bind-mount sources must be HOST paths. ${PWD} is this dir at
    # `docker compose up` time; the Django data lives one level down.
    FLEET_HOST_DATA_DIR: ${PWD}/chachkalica/data
    # Reach the trainer by its compose service name on the shared network. This
    # overrides the TrainingSettings.service_base_url DB default (localhost:8200)
    # without an admin edit.
    TRAINING_SERVICE_URL: http://trainer:8200
    # Reach the Grounding SAM ML backend the same way.
    SAM_BACKEND_URL: http://sam-backend:9090
    # And the vision-language model backend the VLM tab's runs call per frame.
    VLM_BACKEND_URL: http://vlm-backend:9091
    # bgutil-ytdlp-pot-provider (installed via requirements.txt) reads this to
    # find its companion BotGuard-solving server — see videos/services/downloader.py.
    YT_POT_SERVER_URL: http://yt-pot-server:4416
  volumes:
    - ./chachkalica/data:/app/data
    - /var/run/docker.sock:/var/run/docker.sock
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
    yt-pot-server:
      condition: service_started

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    # Host 5432 is already taken by another stack on this box; publish on 5433.
    # In-network clients still reach it as `postgres:5432`.
    ports:
      - "5433:5432"
    volumes:
      - fleet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # BotGuard-solving companion server for bgutil-ytdlp-pot-provider (see
  # chachkalica/requirements.txt + videos/services/downloader.py). Mints the PO
  # Token YouTube now requires on the actual videoplayback fetch — the JS
  # runtime (deno, in the app image) only solves the separate sig/n challenge
  # and isn't enough on its own. Internal-only: nothing outside the compose
  # network needs to reach it.
  yt-pot-server:
    # The published image ships with no CA certificates (see yt_pot_server/Dockerfile) —
    # a bare `image:` here would 500 on every PO Token request.
    build: ./yt_pot_server
    init: true
    restart: unless-stopped
    environment:
      # This network's TLS-inspecting proxy (a self-signed "atlas-MASTER" root,
      # not installed in any container's trust store here) MITMs the fetch this
      # server makes to www.google.com to solve YouTube's BotGuard challenge.
      # The connection is already intercepted either way; this just stops Node
      # from refusing it. Scope is narrow: only this container's own outbound
      # calls to fetch that public challenge script are affected.
      NODE_TLS_REJECT_UNAUTHORIZED: "0"

  web:
    <<: *app
    # Threaded workers are not optional: the camera MJPEG endpoints hold a
    # response open for as long as the operator watches, so a sync worker would
    # be parked for the whole stream and the rest of the admin would hang until
    # gunicorn's timeout killed it. Keep the gunicorn args on ONE line — a
    # folded YAML scalar (>) preserves the newline before a *more indented*
    # line, which would silently split the command and drop every flag after
    # the break, leaving the defaults (1 sync worker, 30 s timeout).
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn fleetsite.wsgi:application --bind 0.0.0.0:9000 --workers 2 --worker-class gthread --threads 8 --timeout 120"
    # Published on 9000 so it inherits the webhook's host port: Label Studio
    # containers keep hitting http://host.docker.internal:9000/hook.
    ports:
      - "9000:9000"

  # Multiple replicas so a long-running job (e.g. a training/eval poll job,
  # see training/jobs.py JOB_TIMEOUT) can't starve short jobs like annotator
  # provisioning — RQ workers pull jobs off "default" one at a time each, so
  # one busy worker no longer blocks the rest.
  worker:
    <<: *app
    command: python manage.py rqworker default
    deploy:
      replicas: ${RQ_WORKER_REPLICAS:-3}

  # Holds the RTSP connections for registered cameras and refreshes their
  # latest frame in Redis (see chachkalica/cameras/management/commands/
  # stream_cameras.py and chachkalica/docs/camera-live-preview.md).
  # Deliberately its own service rather than `<<: *app` — it only needs
  # Postgres (to read Camera rows) and Redis, not the docker socket, data/
  # mount, or trainer/SAM URLs the other app services use.
  camera-workers:
    build: ./chachkalica
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      REDIS_URL: redis://redis:6379/0
    command: python manage.py stream_cameras
    restart: unless-stopped
    # Lets a camera's rtsp_url point at host.docker.internal to reach a
    # stream that's only tunneled/reachable from the host itself (e.g. an
    # SSH -L port forward), the same way web/worker/trainer already can.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Runs each camera's configured model over the frames camera-workers cached
  # (see chachkalica/cameras/management/commands/infer_cameras.py and
  # chachkalica/docs/camera-live-inference.md). Separate from camera-workers
  # because it needs things that one deliberately does without: the shared
  # data/ mount (each frame is handed to the trainer as a PATH — see the SHARED
  # FILESYSTEM note above) and the trainer URL. It still needs no RTSP access,
  # no docker socket, and no GPU of its own — the trainer owns the GPU.
  camera-inference:
    build: ./chachkalica
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      REDIS_URL: redis://redis:6379/0
      TRAINING_SERVICE_URL: http://trainer:8200
    volumes:
      - ./chachkalica/data:/app/data
    command: python manage.py infer_cameras
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  trainer:
    # Repo-root context so the image can hold BOTH friendy_chachkalica/ and
    # chachak/ side by side — chachak (run by the /pipeline endpoint) imports
    # friendy_chachkalica as a package from the repo root. See its Dockerfile.
    build:
      context: .
      dockerfile: friendy_chachkalica/Dockerfile
    environment:
      FC_PORT: ${FC_PORT:-8200}
      # Single-GPU safety: refuse a second concurrent launch with HTTP 409.
      FC_MAX_CONCURRENT: ${FC_MAX_CONCURRENT:-1}
      # Hugging Face weights (rtdetr/dfine ``from_pretrained`` repo ids) live in
      # the MOUNTED data dir, not the container's own ~/.cache — this container
      # recreates itself periodically and would otherwise lose the whole cache
      # and re-fetch. huggingface.co is unreachable from this network, so the
      # cache is populated out-of-band (downloaded elsewhere, untarred here) and
      # HF_HUB_OFFLINE stops every ``from_pretrained`` paying a connection
      # timeout before falling back to it. Unset it if the hub becomes reachable
      # and you want to pull a repo id that is not cached yet.
      HF_HOME: /app/data/hf_cache
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
    # PyTorch DataLoader workers pass image batches through /dev/shm; Docker's
    # default 64 MB is far too small. Bump higher for many workers / large batches.
    shm_size: ${FC_SHM_SIZE:-2gb}
    # Host 8200 is taken by another stack (openbao) on this box; publish on 8201.
    # The container still listens on FC_PORT (8200), which is what Django targets
    # in-network via TRAINING_SERVICE_URL=http://trainer:8200.
    ports:
      - "${FC_HOST_PORT:-8201}:${FC_PORT:-8200}"
    volumes:
      # Same host data dir at the same container path as web/worker — see the
      # SHARED FILESYSTEM note above. source/ stays writable for label promotion.
      - ./chachkalica/data:/app/data
      - ./chachkalica/data/source:/app/data/source
      - ./models:/app/models:ro
      # Nsight Systems, for the bundle benchmark's opt-in per-kernel profile. Mounted
      # rather than baked into the image because it is ~1.1 GB, and read-only because
      # nothing here writes to it. Point NSYS_HOST_DIR at whatever the host has (a CUDA
      # toolkit install puts it under /opt/nvidia/nsight-systems/<version>).
      #
      # Nothing breaks if the path is wrong or absent: the harness looks for nsys, finds
      # none, and records "Nsight profile unavailable" as a warning while every other
      # measurement proceeds. Tracing works unprivileged; GPU performance counters
      # (occupancy) do not and are deliberately never requested — see
      # chachkalica/docs/bundle-benchmarks.md.
      - ${NSYS_HOST_DIR:-/opt/nvidia/nsight-systems/2025.5.2}:/opt/nsight:ro
    restart: unless-stopped

    # ───────────────────────────────── GPU ─────────────────────────────────
    # Requires the NVIDIA Container Toolkit on the host. Exposes the GPU(s);
    # without it, device 'auto' falls back to CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # A TensorRT build node on THIS box, for exercising the remote-build path
  # without a second machine. Profile-gated: `docker compose up` does not start
  # it, because the whole point of a build node is to run somewhere else, and on
  # this box it would contend with `trainer` for the same GPU.
  #
  #   BUILDNODE_TOKEN=dev-token docker compose --profile buildnode up -d buildnode
  #
  # Deploy it for real with buildnode/docker-compose.yml on the target machine.
  # See chachkalica/docs/build-nodes.md.
  buildnode:
    profiles: ["buildnode"]
    build:
      context: .
      dockerfile: buildnode/Dockerfile
    environment:
      # Weak default on purpose — this service is opt-in, local, and throwaway.
      # It is only safe BECAUSE the port below is bound to loopback. A required
      # variable (${VAR:?}) would be stricter but breaks `docker compose config`
      # for everyone even with the profile inactive, so the port is the control.
      BUILDNODE_TOKEN: ${BUILDNODE_TOKEN:-dev-token}
      BUILDNODE_PORT: 8300
    ports:
      # 127.0.0.1, unlike every other service here: a build node compiles
      # arbitrary uploaded ONNX on the GPU, and this one ships a guessable token.
      # Publishing it on the LAN would hand that to anyone who can reach the box.
      # A REAL node (buildnode/docker-compose.yml) binds all interfaces and
      # demands a real token instead.
      - "127.0.0.1:${BUILDNODE_HOST_PORT:-8300}:8300"
    volumes:
      - buildnode-work:/var/lib/buildnode
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  sam-backend:
    # Grounding-DINO + SAM ML backend, folded in from its standalone
    # ml_backends/sam/docker-compose.yml so it shares the same data mount as
    # web/worker/trainer instead of an unrelated host path.
    build:
      context: ./chachkalica
      dockerfile: ml_backends/sam/Dockerfile
    environment:
      SAM_CHECKPOINT: ${SAM_CHECKPOINT:-/app/models/sam_vit_b_01ec64.pth}
      SAM_MODEL_TYPE: ${SAM_MODEL_TYPE:-vit_b}
      SAM_DEVICE: ${SAM_DEVICE:-cuda}
      SAM_MIN_AVAILABLE_RAM_GB: ${SAM_MIN_AVAILABLE_RAM_GB:-6}
      # Same tree as web/worker/trainer (see SHARED FILESYSTEM note above), so
      # a dataset image's meta.local_path can be a plain path relative to it.
      SAM_DATA_ROOT: /app/data
      SAM_OUTPUT: polygon
      MODEL_DIR: /tmp/label-studio-ml
      AUTO_UPDATE: ""
    ports:
      - "${SAM_HOST_PORT:-9090}:9090"
    volumes:
      - ./chachkalica/data:/app/data
      # Not read-only: entrypoint.sh downloads the checkpoint here on first
      # boot if it's missing. Same repo-root models/ dir the trainer mounts.
      - ./models:/app/models
    restart: unless-stopped
    # ───────────────────────────────── GPU ─────────────────────────────────
    # Shares the box's GPU with `trainer` — fine unless both run heavy work at
    # the same time. Falls back to CPU automatically if no GPU is present
    # (sam_ml_backend.py checks torch.cuda.is_available()).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vlm-backend:
    # Vision-language model backend for the VLM tab. One model warm at a time
    # (see ml_backends/vlm/service.py); the worker hands it frame PATHS on the
    # shared data mount, so it needs that mount and nothing else — no RTSP, no
    # docker socket, no database.
    build:
      context: ./chachkalica
      dockerfile: ml_backends/vlm/Dockerfile
    environment:
      # huggingface.co answers from this network but does not VERIFY: a TLS
      # proxy re-signs it with an internal CA absent from this image's trust
      # store. So every VLM must already be in data/hf_cache/hub, and
      # HF_HUB_OFFLINE stops from_pretrained paying for a handshake that cannot
      # succeed — the same pair the trainer sets. `manage.py fetch_vlm_weights`
      # lists what is missing and how to copy it in.
      HF_HOME: /app/data/hf_cache
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
    ports:
      - "${VLM_HOST_PORT:-9091}:9091"
    volumes:
      - ./chachkalica/data:/app/data
    restart: unless-stopped
    # ───────────────────────────────── GPU ─────────────────────────────────
    # Now a THREE-way share with `trainer` and `sam-backend`. A resident 7B VLM
    # alongside an active training run will OOM — run them one at a time.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  fleet-postgres:
  buildnode-work:
