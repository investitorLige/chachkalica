# Fleet manager stack.
#
#   docker compose up -d postgres redis      # infra only (run web+worker locally)
#   docker compose up -d                      # full stack
#
# The web process and the rq worker share the same image and env. The worker
# mounts the host docker socket so it can start/stop Label Studio containers,
# and both mount data/ so the webhook + sync can read source / write target.
x-app: &app
  build: .
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_DB: fleet
    POSTGRES_USER: fleet
    POSTGRES_PASSWORD: fleet
    REDIS_URL: redis://redis:6379/0
    DJANGO_DEBUG: "true"
    # Containers reach the host-published webhook + Label Studio via the gateway.
    FLEET_LS_HOST: host.docker.internal
    # The worker provisions sibling containers via the host docker daemon, so
    # bind-mount sources must be host paths. ${PWD} is the project dir at
    # `docker compose up` time.
    FLEET_HOST_DATA_DIR: ${PWD}/data
    # This standalone stack has no vlm-backend of its own (that is the unified
    # compose's job), so VLM runs target one published on the host. Without
    # this the worker would try to resolve a service name that does not exist
    # here and every frame would fail.
    VLM_BACKEND_URL: ${VLM_BACKEND_URL:-http://host.docker.internal:9091}
  volumes:
    - ./data:/app/data
    - /var/run/docker.sock:/var/run/docker.sock
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    ports:
      - "5432:5432"
    volumes:
      - fleet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    <<: *app
    # Threaded workers are not optional: the camera MJPEG endpoints hold a
    # response open for as long as the operator watches, so a sync worker would
    # be parked for the whole stream and the rest of the admin would hang until
    # gunicorn's timeout killed it. Keep the gunicorn args on ONE line — a
    # folded YAML scalar (>) preserves the newline before a *more indented*
    # line, which would silently split the command and drop every flag after
    # the break, leaving the defaults (1 sync worker, 30 s timeout).
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn fleetsite.wsgi:application --bind 0.0.0.0:9000 --workers 2 --worker-class gthread --threads 8 --timeout 120"
    # Published on 9000 so it inherits the coco-sync webhook's host port: Label
    # Studio containers keep hitting http://host.docker.internal:9000/hook.
    ports:
      - "9000:9000"

  # Multiple replicas so a long-running job (e.g. a training/eval poll job,
  # see training/jobs.py JOB_TIMEOUT) can't starve short jobs like annotator
  # provisioning — RQ workers pull jobs off "default" one at a time each, so
  # one busy worker no longer blocks the rest.
  worker:
    <<: *app
    command: python manage.py rqworker default
    deploy:
      replicas: ${RQ_WORKER_REPLICAS:-3}

  # Holds the RTSP connections for registered cameras and refreshes their
  # latest frame in Redis (see cameras/management/commands/stream_cameras.py
  # and docs/camera-live-preview.md). Deliberately its own service rather than
  # `<<: *app` — it only needs Postgres (to read Camera rows) and Redis, not
  # the host docker socket or data/ volume the fleet worker uses.
  camera-workers:
    build: .
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      REDIS_URL: redis://redis:6379/0
    command: python manage.py stream_cameras
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Runs each camera's configured model over the frames camera-workers cached
  # (see cameras/management/commands/infer_cameras.py and
  # docs/camera-live-inference.md). Separate from camera-workers because it
  # needs the data/ mount — a frame is handed to the trainer as a PATH, so the
  # trainer must see the same file at the same path — plus the trainer's URL.
  # This standalone stack has no trainer of its own (that's the unified
  # compose's job), so it targets one running on the host.
  camera-inference:
    build: .
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      REDIS_URL: redis://redis:6379/0
      TRAINING_SERVICE_URL: ${TRAINING_SERVICE_URL:-http://host.docker.internal:8200}
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python manage.py infer_cameras
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  fleet-postgres:
