{% extends "admin/base_site.html" %}

{% block content %}
<p>Transfer the following {{ opts.verbose_name_plural }} to a different admin section:</p>
<ul>
  {% for obj in objects %}
    <li>{{ obj }}</li>
  {% endfor %}
</ul>

<form action="" method="post">
  {% csrf_token %}
  {% for pk in selected %}
    <input type="hidden" name="{{ action_checkbox_name }}" value="{{ pk }}">
  {% endfor %}
  <input type="hidden" name="action" value="{{ action }}">
  <input type="hidden" name="apply" value="1">

  <p>
    <label for="section">Destination:</label>
    <select name="section" id="section">
      <option value="">— Main admin (unassigned) —</option>
      {% for section in sections %}
        <option value="{{ section.pk }}">{{ section.name }}</option>
      {% endfor %}
    </select>
  </p>

  <div class="submit-row">
    <input type="submit" class="default" value="Transfer">
    <a href="../" class="button cancel-link">Cancel</a>
  </div>
</form>
{% endblock %}
